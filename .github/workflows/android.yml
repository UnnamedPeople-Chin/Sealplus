name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -A 1 'val currentVersion: Version =' buildSrc/src/main/kotlin/Version.kt | grep -oP 'versionMajor = \K\d+' | head -1).$(grep -A 1 'val currentVersion: Version =' buildSrc/src/main/kotlin/Version.kt | grep -oP 'versionMinor = \K\d+' | head -1).$(grep -A 1 'val currentVersion: Version =' buildSrc/src/main/kotlin/Version.kt | grep -oP 'versionPatch = \K\d+' | head -1)
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Read release configuration
        id: release_config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          else
            SHOULD_RELEASE=$(jq -r '.release' release.json)
          fi
          echo "SHOULD_RELEASE=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release flag: ${SHOULD_RELEASE}"

      - name: Decode keystore
        id: signing
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SHOULD_RELEASE: ${{ steps.release_config.outputs.SHOULD_RELEASE }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            if [ "$SHOULD_RELEASE" = "true" ]; then
              echo "::error::ANDROID_SIGNING_KEY secret is required when publishing a release."
              exit 1
            fi
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_OUTPUT"
            echo "No signing key configured; building unsigned artifacts only."
            exit 0
          fi
          echo "$ANDROID_SIGNING_KEY" | tr -d '\n\r ' | base64 --decode > "${{ runner.temp }}/release.jks"
          echo "HAS_SIGNING_KEY=true" >> "$GITHUB_OUTPUT"

      - name: Build and sign Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HAS_SIGNING_KEY: ${{ steps.signing.outputs.HAS_SIGNING_KEY }}
        run: |
          chmod +x gradlew
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew assembleGenericRelease --parallel --build-cache --no-daemon --no-scan \
              -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleGenericRelease --parallel --build-cache --no-daemon --no-scan
          fi

      - name: Prepare release notes
        if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
        env:
          REL_VERSION: ${{ steps.version.outputs.VERSION }}
          REL_REPO: ${{ github.repository }}
          REL_SHA: ${{ github.sha }}
        run: |
          BODY_FILE="${{ runner.temp }}/release_notes.md"
          VER="$REL_VERSION" REPO="$REL_REPO" SHA="$REL_SHA" python3 -c "import os, pathlib, re; ver=os.environ['VER']; repo=os.environ['REPO']; sha=os.environ['SHA']; ch=pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8'); m=re.search(r'^## \[' + re.escape(ver) + r'\].*?\n(.*?)(?=\n## \[|\Z)', ch, flags=re.M|re.S); notes=m.group(1).strip() if m else f'Release v{ver}.'; out=f'## ✨ Seal Plus v{ver}\n\n{notes}\n\n### 📦 Installation\n\n- **Universal APK**: Works on all devices (recommended if unsure)\n- **arm64-v8a**: 64-bit ARM devices (most modern Android phones)\n- **armeabi-v7a**: 32-bit ARM devices\n- **x86_64**: 64-bit x86 devices\n- **x86**: 32-bit x86 devices\n\n### 📜 Full Changelog\nSee [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md)\n\n---\nCommit: \`{sha}\`\n'; pathlib.Path('$BODY_FILE').write_text(out, encoding='utf-8')"

      - name: Create Release
        if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Seal Plus v${{ steps.version.outputs.VERSION }}
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/generic/release/*.apk

      - name: Send Telegram Notification to Channel
        if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
        continue-on-error: true
        env:
          TGTOKEN: ${{ secrets.TGTOKEN }}
          TGCHANNEL: ${{ secrets.TGCHANNEL }}
        run: |
          if [ -z "$TGTOKEN" ] || [ -z "$TGCHANNEL" ]; then
            echo "Telegram notification skipped (TGTOKEN or TGCHANNEL not configured)"
            exit 0
          fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"
          MESSAGE="<b>🎉 Seal Plus v${{ steps.version.outputs.VERSION }} Released!</b>%0A%0A${RELEASE_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${TGTOKEN}/sendMessage" \
            -d "chat_id=${TGCHANNEL}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SealPlus-${{ steps.version.outputs.VERSION }}-apks
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 20
